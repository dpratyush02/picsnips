<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="sliceGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Base rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Slices representing PicSnips 20-image split -->
  <g fill="#ffffff">
    <rect x="96" y="116" width="40" height="280" rx="10" opacity="1.0" fill="url(#sliceGlow)"/>
    <rect x="160" y="116" width="40" height="280" rx="10" opacity="0.9"/>
    <rect x="224" y="116" width="40" height="280" rx="10" opacity="0.75"/>
    <rect x="288" y="116" width="40" height="280" rx="10" opacity="0.6"/>
    <rect x="352" y="116" width="40" height="280" rx="10" opacity="0.4"/>
  </g>
</svg>

